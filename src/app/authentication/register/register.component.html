<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4" style="width: 350px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);">
    <h3 class="text-center mb-4">Register</h3>
    <form (ngSubmit)="registerUser()" #registerForm="ngForm">
      
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          name="name"
          [(ngModel)]="user.name"
          placeholder="Enter full name"
          required
          #nameField="ngModel"
        />
        <div *ngIf="nameField.touched && nameField.invalid" class="text-danger">
          Name is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="emailOrMobile" class="form-label">Email</label>
        <input
          type="text"
          id="emailOrMobile"
          class="form-control"
          name="emailOrMobile"
          [(ngModel)]="user.emailOrMobile"
          placeholder="Enter email"
          required
          [pattern]="'^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,4}$'"
          #emailOrMobileField="ngModel"
        />
        <div *ngIf="emailOrMobileField.touched && emailOrMobileField.invalid" class="text-danger">
          <div *ngIf="emailOrMobileField.errors?.required">Email is required.</div>
          <div *ngIf="emailOrMobileField.errors?.pattern">Please enter a valid email.</div>
        </div>
      </div>

      <!-- Password Field with Toggle -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            name="password"
            [(ngModel)]="user.password"
            placeholder="Enter password"
            minlength="8"
            required
            #passwordField="ngModel"
          />
          <span class="input-group-text" style="cursor: pointer;" (click)="toggleShowPassword()">
            <i [ngClass]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </span>
        </div>
        <div *ngIf="passwordField.touched && passwordField.invalid" class="text-danger">
          <div *ngIf="passwordField.errors?.required">Password is required.</div>
          <div *ngIf="passwordField.errors?.minlength">Password must be at least 8 characters long.</div>
        </div>
      </div>

      <!-- Confirm Password Field with Toggle -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            class="form-control"
            name="confirmPassword"
            [(ngModel)]="user.confirmPassword"
            placeholder="Confirm password"
            minlength="8"
            required
            #confirmPasswordField="ngModel"
          />
          <span class="input-group-text" style="cursor: pointer;" (click)="toggleShowConfirmPassword()">
            <i [ngClass]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </span>
        </div>
        <div *ngIf="confirmPasswordField.touched && confirmPasswordField.invalid" class="text-danger">
          <div *ngIf="confirmPasswordField.errors?.required">Confirmation password is required.</div>
          <div *ngIf="confirmPasswordField.errors?.minlength">Password must be at least 8 characters long.</div>
        </div>
        <div *ngIf="user.password !== user.confirmPassword && registerForm.submitted" class="text-danger">
          Passwords do not match.
        </div>
      </div>

      <div class="d-grid mt-3">
        <button
          type="submit"
          class="btn btn-warning"
          [disabled]="registerForm.invalid"
        >
          Register
        </button>
      </div>
    </form>

    <div class="mt-3 text-center">
      <a routerLink="/login" class="text-decoration-none">Already have an account? Login</a>
    </div>
  </div>
</div>

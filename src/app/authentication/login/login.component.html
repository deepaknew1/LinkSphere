<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LinkSphere</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <style>
    .description {
      font-size: 1.5rem;
      color: #333;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: normal;
      overflow-wrap: break-word;
    }

    .vh-100 {
      height: 100vh;
    }

    .container-fluid {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* For Mobile (less than 768px) */
    @media (max-width: 767px) {
      .container-fluid {
        flex-direction: column;
      }

      .col-6 {
        width: 100%;
      }

      .description {
        margin-bottom: 20px;
      }
    }

    /* For larger devices (desktop, tablets) */
    @media (min-width: 768px) {
      .description {
        font-size: 1.25rem;
        padding: 20px;
        text-align: center;
        max-width: 80%;
        margin: 0 auto;
      }

      .col-6:first-child {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    }
  </style>
</head>

<body>

  <div class="container-fluid vh-100">
    <!-- Left side for the description (on larger screens) -->
    <div class="col-6 p-5">
      <div id="description" class="description">
        LinkSphere helps you save, organize, and effortlessly access all your favorite links—from social media to websites and beyond—anytime, anywhere.
      </div>
    </div>

    <!-- Right side for the login form -->
    <div class="col-6 d-flex justify-content-center align-items-center">
      <div class="card p-4" style="width: 350px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);">
        <h3 class="text-center mb-4">Login</h3>
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input
              type="text"
              id="username"
              class="form-control"
              name="username"
              [(ngModel)]="username"
              placeholder="Enter email"
              required
              #usernameField="ngModel"
            />
            <div *ngIf="usernameField.touched && usernameField.invalid" class="text-danger">
              Email is required.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <!-- Input group for password field and toggle icon -->
            <div class="input-group">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                class="form-control"
                name="password"
                [(ngModel)]="password"
                placeholder="Enter password"
                required
                #passwordField="ngModel"
              />
              <span class="input-group-text" style="cursor: pointer;" (click)="toggleShowPassword()">
                <i [ngClass]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
              </span>
            </div>
            <div *ngIf="passwordField.touched && passwordField.invalid" class="text-danger">
              Password is required.
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger mt-2">
            {{ errorMessage }}
          </div>

          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-warning" [disabled]="loginForm.invalid">
              Login
            </button>
          </div>
        </form>
        <!-- <div class="mt-2 text-center">
          <a routerLink="/forgot" class="text-decoration-none">Forgot your password?</a>
        </div> -->
        <div class="mt-3 text-center">
          <a routerLink="/register" class="text-decoration-none">Don't have an account? Create one</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
